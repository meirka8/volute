services:
  desktop:
    build: .
    ports:
      - "6080:6080"       # noVNC web UI
      - "5901:5901"   # VNC direct (Remmina)
    volumes:
      - ./extension:/workspace/extension:ro   # your ext source, read-only
    # Notably: NO volume for ~/.vscode or VS Code user data
    # So every restart = clean slate
    tmpfs:
      - /tmp              # ephemeral temp including vscode-user/ext dirs above
    shm_size: '256mb'     # VS Code needs this