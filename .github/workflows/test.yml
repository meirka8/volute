name: Test OSS components

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pins resolved from the official action repositories with git ls-remote:
# actions/checkout@v4: 11d5960a326750d5838078e36cf38b85af677262
# actions/setup-node@v4: 49933ea5288caeca8642d1e84afbd3f7d6820020
# dtolnay/rust-toolchain@stable: 4cda84d5c5c54efe2404f9d843567869ab1699d4
# Swatinem/rust-cache@v2: 42dc69e1aa15d09112580998cf2ef0119e2e91ae
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-quality:
    name: Rust format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: . -> target
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: . -> target
      - name: Run workspace tests
        # test_parse_vscode_session depends on volatile VS Code session fixtures
        # and is deliberately skipped until it can be made deterministic.
        run: cargo test --workspace --verbose -- --skip test_parse_vscode_session

  rust-windows:
    name: Rust workspace check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Check all Rust targets
        run: cargo check --workspace --all-targets

  plugin:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cvc-plugin/package-lock.json
      - name: Install dependencies
        working-directory: cvc-plugin
        run: npm ci
      - name: Verify lockfile-backed VSCE is available
        working-directory: cvc-plugin
        run: npm exec --no -- vsce --version
      - name: Check types
        working-directory: cvc-plugin
        run: npm run check-types
      - name: Lint
        working-directory: cvc-plugin
        run: npm run lint
      - name: Compile
        working-directory: cvc-plugin
        run: npm run compile
      - name: Run extension tests
        # VS Code's Electron runner needs an X server on Linux.
        working-directory: cvc-plugin
        run: xvfb-run -a npm test

  reviewer:
    name: Reviewer lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cvc-reviewer/package-lock.json
      - name: Install dependencies
        working-directory: cvc-reviewer
        run: npm ci
      - name: Lint
        working-directory: cvc-reviewer
        run: npm run lint
      - name: Test
        working-directory: cvc-reviewer
        run: npm test -- --run
      - name: Build
        working-directory: cvc-reviewer
        run: npm run build

  npm-wrapper:
    name: MCP npm wrapper package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Keep this pin in lockstep with the "Install npm 12.0.2 for trusted
      # publishing" step of the publish-npm job in release.yml. The manifest
      # guards below only mean anything on the npm that really publishes, and
      # the two files cannot share a variable, so bump both together.
      - name: Install the npm version used to publish
        run: npm install --global npm@12.0.2
      - name: Check wrapper syntax
        working-directory: npm/cvc-mcp
        run: |
          node --check bin/cvc-mcp.js
          node --check bin/cvc.js
          node --check bin/cvc-lsp.js
          node --check scripts/stage-package.mjs
          node --check scripts/publish-convergent.mjs
      - name: Run wrapper tests
        working-directory: npm/cvc-mcp
        run: npm test
      # The release asks the registry about each package name with `npm view`
      # and tells "not published" (an E404) from every other failure by parsing
      # npm's JSON error. The tests above feed it recorded npm output and replies
      # from a local registry; this runs the same code against the live registry
      # with the pinned npm, so a change in npm's output fails here instead of in
      # the middle of a release.
      # 999.0.0 is never published, so both names must come back as "would
      # publish". --decide-only publishes nothing and needs no credentials.
      - name: Check the registry lookup the release uses
        working-directory: npm/cvc-mcp
        run: node scripts/publish-convergent.mjs --version 999.0.0 --decide-only
      # The launcher is published under more than one name. Both manifests are
      # checked below, each staged by the same script the release uses
      # (scripts/stage-package.mjs), which is the only place that derives the
      # second package from the source directory; `--list` supplies the names, so
      # none is repeated here.
      #
      # Guard 1, independent of how npm words its warnings: if `npm pkg fix`
      # changes a manifest, npm would also rewrite it while publishing. Every
      # name is checked and reported before the step fails.
      - name: Verify npm would not rewrite either manifest
        working-directory: npm/cvc-mcp
        run: |
          set -euo pipefail
          names="$(node scripts/stage-package.mjs --list)"
          failed=0
          for name in $names; do
            dir="$(node scripts/stage-package.mjs "$name")"
            before="${RUNNER_TEMP}/package.json.before"
            cp "$dir/package.json" "$before"
            (cd "$dir" && npm pkg fix)
            if ! diff -u "$before" "$dir/package.json"; then
              echo "::error file=npm/cvc-mcp/package.json::npm would rewrite the manifest of ${name} on publish. Run 'npm pkg fix' in npm/cvc-mcp and commit the result."
              failed=1
            fi
          done
          exit "$failed"
      # Guard 2 replays the release publish of each name without publishing, so
      # a manifest npm auto-corrects fails the build before a tag exists. It also
      # lists the tarball contents (running the prepack/postpack lifecycle
      # scripts), which makes a separate `npm pack --dry-run` redundant. Needs no
      # credentials: a dry run only reads the public registry, and it passes for
      # a name that is not on the registry yet. Every name is checked and
      # reported before the step fails.
      - name: Dry-run the npm publish of each package and fail on manifest corrections
        working-directory: npm/cvc-mcp
        run: |
          set -euo pipefail
          names="$(node scripts/stage-package.mjs --list)"
          failed=0
          for name in $names; do
            log="${RUNNER_TEMP}/npm-publish-dry-run-${name##*/}.log"
            # The committed version is always the last one published, and even a
            # dry run refuses to publish over it. Use a throwaway prerelease that
            # never exists on the registry; npm requires an explicit tag other
            # than latest to publish a prerelease.
            dir="$(node scripts/stage-package.mjs "$name" --version "0.0.0-ci.${GITHUB_RUN_ID}")"
            if ! (cd "$dir" && npm publish --dry-run --access public --tag ci-dry-run --registry=https://registry.npmjs.org/) 2>&1 | tee "$log"; then
              echo "::error file=npm/cvc-mcp/package.json::The npm publish dry run failed for ${name}."
              failed=1
            elif grep -qi 'auto-corrected' "$log"; then
              echo "::error file=npm/cvc-mcp/package.json::npm auto-corrected the manifest of ${name} while publishing. Run 'npm pkg fix' in npm/cvc-mcp and commit the result."
              failed=1
            fi
          done
          exit "$failed"

  claude-code-plugin:
    name: Claude Code plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # Not the VS Code extension (the `plugin` job above): this checks the
      # Claude Code plugin in plugins/claude-code and the Claude Code plugin
      # marketplace in .claude-plugin/marketplace.json. Claude Code itself is not
      # installed here; the script enforces the documented manifest and hook
      # contract and keeps the plugin version equal to cvc-cli's.
      - name: Self-test the Claude Code plugin checker
        run: node .github/scripts/check-claude-plugin.mjs --self-test
      - name: Check the Claude Code plugin and marketplace
        run: node .github/scripts/check-claude-plugin.mjs

  installer-unix:
    name: Shell installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # install.sh itself downloads a release, so it is not run against the
      # network. The script runs the real install.sh in a throwaway HOME with a
      # stand-in for curl that serves archives built there, and checks what ends
      # up where: the binaries, and LICENSE and THIRD-PARTY-NOTICES.md in
      # share/cvc beside the install directory (one copy of each after a re-run,
      # replaced in place by an upgrade); archives that lack the notices;
      # destinations that must be refused; and that the checksum and extraction
      # checks still stop an install before anything is written. It runs under
      # each runner's own sh and tar: dash and GNU tar on Ubuntu, bash and bsdtar
      # on macOS.
      - name: Test install.sh
        run: sh .github/scripts/test-install-sh.sh

  installer-windows:
    name: PowerShell installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # install.ps1 itself downloads a release, so it is not run here. The script
      # lifts its publish and PATH-prompt functions out of the syntax tree and
      # tests them offline: replacing a running .exe, restoring on failure,
      # sweeping retired images, and skipping the prompt without input. It runs
      # under both shells because `irm | iex` uses Windows PowerShell 5.1 by default.
      - name: Test install.ps1 on Windows PowerShell 5.1
        shell: powershell
        run: ./.github/scripts/test-install-ps1.ps1
      - name: Test install.ps1 on PowerShell 7
        shell: pwsh
        run: ./.github/scripts/test-install-ps1.ps1

  third-party-notices:
    name: Verify third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cvc-plugin/package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Fetch locked Rust package sources
        run: cargo fetch --locked
      - name: Install production extension dependencies without lifecycle scripts
        working-directory: cvc-plugin
        run: npm ci --ignore-scripts --omit=dev
      - name: Verify mechanically generated notices
        run: |
          node .github/scripts/generate-third-party-notices.mjs --self-test
          node .github/scripts/generate-third-party-notices.mjs --check
      - name: Self-test the convergent Marketplace publish script
        run: node .github/scripts/publish-vsix-convergent.mjs --self-test
