name: Improvement
description: Suggest a focused improvement to an existing Volute or CVC experience.
title: "improvement: "
labels:
  - "type: improvement"
body:
  - type: markdown
    attributes:
      value: |
        For a suspected vulnerability, do not open a public issue. Report it privately through the [Security Policy](https://github.com/meirka8/volute/security/policy).
  - type: textarea
    id: current-experience
    attributes:
      label: Current experience
      description: Describe what is difficult, unclear, or inefficient today.
    validations:
      required: true
  - type: textarea
    id: desired-experience
    attributes:
      label: Desired experience
      description: Describe how the experience should improve.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: User impact
      description: Who is affected and how often or severely?
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility considerations
      description: Note migration, behavior, API, file-format, or integration compatibility concerns. Write N/A if none are known.
    validations:
      required: true
  - type: textarea
    id: privacy-security
    attributes:
      label: Privacy and security implications
      description: Describe relevant considerations. Do not include sensitive details; use the Security Policy for suspected vulnerabilities.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Suggested component
      options:
        - Core
        - CLI
        - MCP Server
        - Language Server
        - VS Code Extension
        - Reviewer
        - Repository / Cross-component
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include credentials, captured prompts, personal data, private repository details, or generated CVC state. This is not a vulnerability report.
          required: true
