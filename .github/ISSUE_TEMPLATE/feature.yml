name: Feature request
description: Propose a new capability for Volute or CVC.
title: "feature: "
labels:
  - "type: feature"
body:
  - type: markdown
    attributes:
      value: |
        For a suspected vulnerability, do not open a public issue. Report it privately through the [Security Policy](https://github.com/meirka8/volute/security/policy).
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user problem or unmet need does this address?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result users should be able to achieve, rather than a prescribed implementation.
    validations:
      required: true
  - type: textarea
    id: beneficiaries
    attributes:
      label: Beneficiaries and workflow
      description: Who benefits, and how would this fit into their workflow?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches have you considered?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Suggested component
      options:
        - Core
        - CLI
        - MCP Server
        - Language Server
        - VS Code Extension
        - Reviewer
        - Repository / Cross-component
    validations:
      required: true
  - type: dropdown
    id: initiative
    attributes:
      label: Optional initiative
      options:
        - None
        - Productization
        - Open Provenance Format
        - Agent-First Capture
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not include credentials, captured prompts, personal data, private repository details, or generated CVC state. This is not a vulnerability report.
          required: true
