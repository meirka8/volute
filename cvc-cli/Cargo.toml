[package]
name = "cvc-cli"
version = "0.4.2"
edition = "2021"
description = "Command-line interface for Cognitive Version Control"
license = "Apache-2.0"
repository = "https://github.com/meirka8/volute"

[[bin]]
name = "cvc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
cvc-core = { version = "0.4.2", path = "../cvc-core" }
git2 = "0.19"
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = "2.3"
directories = "5.0"
# For extracting components
flate2 = "1.0"
tar = "0.4"
zip = "0.6"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3.24"
rusqlite = { version = "0.32", features = ["bundled"] }
