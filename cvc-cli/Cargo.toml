[package]
name = "cvc-cli"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "cvc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
cvc-core = { path = "../cvc-core" }
git2 = "0.19"
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = "2.3"
directories = "5.0"
# For extracting components
flate2 = "1.0"
tar = "0.4"
zip = "0.6"


