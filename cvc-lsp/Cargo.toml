[package]
name = "cvc-lsp"
version = "0.3.5"
edition = "2021"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cvc-core = { path = "../cvc-core" }
anyhow = "1.0"
env_logger = "0.10"
log = "0.4"
dashmap = "5.5"
chrono = { version = "0.4", features = ["serde"] }
git2 = "0.19"

[dev-dependencies]
tempfile = "3.10"
