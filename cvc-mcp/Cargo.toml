[package]
name = "cvc-mcp"
version = "0.4.1"
edition = "2021"

[[bin]]
name = "cvc-mcp"
path = "src/main.rs"

[dependencies]
cvc-core = { path = "../cvc-core" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
git2 = "0.19"
