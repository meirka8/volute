<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Volute VC Extension Icon -->

  <!-- Background: Cognitive Navy -->
  <rect width="128" height="128" rx="16" fill="#0A192F"/>

  <!-- Gradients -->
  <defs>
    <linearGradient id="scrollFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#112240;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A192F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Container Group - centered and scaled for 128x128 -->
  <g transform="translate(64, 60) scale(0.35)">

    <!-- The Scroll Shape (Side view of a volute/paper roll) -->
    <!-- Main body -->
    <path d="M-60,-80 L60,-80 L60,80 C60,120 20,140 -20,140 C-60,140 -100,110 -100,70 L-100,-40 C-100,-60 -80,-80 -60,-80 Z"
          fill="url(#scrollFill)"
          stroke="#64FFDA"
          stroke-width="4"/>

    <!-- The Inner Spiral / Roll at the bottom -->
    <path d="M60,80 C60,110 40,130 0,130 C-40,130 -50,110 -50,90 C-50,70 -30,60 -10,60"
          fill="none"
          stroke="#E6F1FF"
          stroke-width="3"
          stroke-linecap="round"/>

    <!-- Top edge highlight -->
    <line x1="-60" y1="-80" x2="60" y2="-80" stroke="#E6F1FF" stroke-width="3" />

  </g>
</svg>
