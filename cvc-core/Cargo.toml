[package]
name = "cvc-core"
version = "0.2.4"
edition = "2021"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "time"] }
git2 = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3.24.0"
