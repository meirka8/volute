[package]
name = "cvc-core"
version = "0.4.2"
edition = "2021"
description = "Core library for Cognitive Version Control"
license = "Apache-2.0"
repository = "https://github.com/meirka8/volute"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "time"] }
git2 = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
regex = "1.11"
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.24.0"
